name: Optolithium CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release from this manual run?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag name to publish (e.g., v1.0.0) if publishing manually'
        required: false
        default: ''
        type: string

# Default to read-only permissions; elevate only in the release job
permissions:
  contents: read

# Cancel redundant in-progress runs on the same branch/PR, but never cancel tag releases
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  PYTHON_VERSION: '3.12'
  VENV_PATH: ${{ github.workspace }}/.cache/optolithium/venv
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

jobs:
  build-and-test:
    name: Build Core & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache C++ Build (ccache) & Optolithium Venv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/optolithium/venv
            ~/.cache/ccache
          key: ${{ runner.os }}-optolithium-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'rebuild_linux.sh', '**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-optolithium-py${{ env.PYTHON_VERSION }}-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ccache \
            swig \
            libfftw3-dev \
            liblapack-dev \
            libopenblas-dev \
            libarmadillo-dev \
            python3-dev \
            python3-venv \
            xvfb

      - name: Check Semantic Version Status
        run: |
          chmod +x version.sh tools/version_manager.py
          ./version.sh status

      - name: Build C++ Core Engine & Plugins
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          chmod +x rebuild_linux.sh
          bash rebuild_linux.sh

      - name: Verify SQLAlchemy Dependency
        run: |
          export VENV_PYTHON="${HOME}/.cache/optolithium/venv/bin/python"
          $VENV_PYTHON -c "import sqlalchemy.exc; print('SQLAlchemy', sqlalchemy.__version__)"

      - name: Run Sanity Test Suite
        run: |
          export VENV_PYTHON="${HOME}/.cache/optolithium/venv/bin/python"
          xvfb-run --auto-servernum $VENV_PYTHON tests/test_sanity.py

  build-packages:
    name: Build Linux Packages (RPM & DEB)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Cached C++ Build & Venv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/optolithium/venv
            ~/.cache/ccache
          key: ${{ runner.os }}-optolithium-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'rebuild_linux.sh', '**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-optolithium-py${{ env.PYTHON_VERSION }}-

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ccache \
            swig \
            libfftw3-dev \
            liblapack-dev \
            libopenblas-dev \
            libarmadillo-dev \
            python3-dev \
            python3-venv \
            rpm \
            dpkg-dev \
            createrepo-c

      - name: Build C++ Engine & Plugins
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          chmod +x rebuild_linux.sh
          bash rebuild_linux.sh

      - name: Build Linux Standalone Packages (.rpm & .deb)
        run: |
          chmod +x build_packages.sh packaging/*.sh
          ./build_packages.sh

      - name: Verify Packages & Generate SHA256 Checksums
        run: |
          echo "=== Generated Packages ==="
          ls -lh dist/rpm/*.rpm
          ls -lh dist/deb/*.deb
          ls -lh dist/*.repo dist/*.list 2>/dev/null || true

          # Generate SHA256SUMS.txt for package verification
          sha256sum dist/rpm/*.rpm dist/deb/*.deb > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

          # Publish build report to the GitHub Actions UI Summary page
          echo "### 📦 Built Package Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in dist/rpm/*.rpm dist/deb/*.deb; do
            echo "| \`$(basename "$f")\` | $(du -h "$f" \vert{} cut -f1) \vert{}" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔐 SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: optolithium-packages
          retention-days: 30
          path: |
            dist/rpm/*.rpm
            dist/deb/*.deb
            dist/optolithium.repo
            dist/optolithium.list
            dist/optolithium.sources
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.release_tag != '')
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Built Packages
        uses: actions/download-artifact@v7
        with:
          name: optolithium-packages
          path: release-artifacts

      - name: Flatten Artifacts for Release Upload
        run: |
          mkdir -p release-upload
          find release-artifacts -type f -exec cp {} release-upload/ \;
          ls -lh release-upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release-upload/*
          generate_release_notes: true
          draft: false
          # Automatically mark tags containing -alpha, -beta, or -rc as Pre-release
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-rc') || contains(inputs.release_tag || github.ref_name, '-beta') || contains(inputs.release_tag || github.ref_name, '-alpha') }}
