name: Optolithium CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build Core & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            swig \
            libfftw3-dev \
            liblapack-dev \
            libopenblas-dev \
            libarmadillo-dev \
            python3-dev \
            python3-venv \
            xvfb

      - name: Check Semantic Version Status
        run: |
          chmod +x version.sh tools/version_manager.py
          ./version.sh status

      - name: Build C++ Core Engine & Plugins
        run: |
          chmod +x rebuild_linux.sh
          bash rebuild_linux.sh

      - name: Run Sanity Test Suite
        run: |
          export VENV_PYTHON="${HOME}/.cache/optolithium/venv/bin/python"
          $VENV_PYTHON tests/test_sanity.py

  build-packages:
    name: Build Linux Packages (RPM & DEB)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            swig \
            libfftw3-dev \
            liblapack-dev \
            libopenblas-dev \
            libarmadillo-dev \
            python3-dev \
            python3-venv \
            rpm \
            dpkg-dev \
            createrepo-c || true

      - name: Build C++ Engine & Plugins
        run: |
          chmod +x rebuild_linux.sh
          bash rebuild_linux.sh

      - name: Build Linux Standalone Packages (.rpm & .deb)
        run: |
          chmod +x build_packages.sh packaging/*.sh
          ./build_packages.sh

      - name: Verify Generated Package Artifacts
        run: |
          echo "=== Generated Packages ==="
          ls -lh dist/rpm/*.rpm
          ls -lh dist/deb/*.deb
          ls -lh dist/*.repo dist/*.list 2>/dev/null || true

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optolithium-packages
          path: |
            dist/rpm/*.rpm
            dist/deb/*.deb
            dist/optolithium.repo
            dist/optolithium.list
            dist/optolithium.sources
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          name: optolithium-packages
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
